spring.application.name=tierforge-backend
server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5433/tierforge
spring.datasource.username=tierforge
spring.datasource.password=tierforge

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

tierforge.enrichment.base-url=http://localhost:8000
tierforge.enrichment.rate-limit-per-second=5
tierforge.enrichment.client-timeout=10s
tierforge.enrichment.max-attempts=5
tierforge.enrichment.lease-duration=12s
tierforge.enrichment.orchestrator-poll-interval=1s
tierforge.enrichment.retry-backoff-base=1s
tierforge.enrichment.retry-backoff-max=8s
